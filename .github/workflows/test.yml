name: push-workflow
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: check node
        run: node --version
      - name: install dependencies
        run: npm install
      - name: run tests
        run: npm test
